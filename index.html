
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#10111a;--panel:#191b28;--text:#f5f5fa;
 --muted:#999caf;--accent:#8067ff;--border:#292b3a;
}
body.light{
 --bg:#f4f5fb;--panel:#fff;--text:#202235;
 --muted:#73768a;--border:#e4e5ed;
}
body{background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:255px;background:var(--panel);
 border-right:1px solid var(--border);padding:20px;
 display:flex;flex-direction:column;gap:20px}
.logo{font-size:25px;font-weight:bold;color:var(--accent)}
.logo span{color:var(--text)}
.newchat{background:var(--accent);color:white;border:0;
 padding:13px;border-radius:10px;cursor:pointer;font-size:15px}
.history-title{color:var(--muted);font-size:12px}
.history{overflow-y:auto;flex:1}
.history-item{padding:12px;border-radius:8px;cursor:pointer;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
 color:var(--muted);margin-top:5px}
.history-item:hover{background:var(--bg);color:var(--text)}
.sidebar-bottom{display:flex;gap:10px}
.sidebar-bottom button{flex:1;padding:10px;border:1px solid var(--border);
 background:transparent;color:var(--text);border-radius:8px;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:65px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 25px}
.topbar h2{font-size:19px}
.status{font-size:12px;color:#45c98b}
.messages{flex:1;overflow-y:auto;padding:30px 8%;
 display:flex;flex-direction:column;gap:22px}
.welcome{text-align:center;margin:auto;max-width:600px}
.welcome h1{font-size:38px;margin-bottom:12px}
.welcome h1 span{color:var(--accent)}
.welcome p{color:var(--muted);line-height:1.6}
.message{max-width:850px;width:100%;margin:0 auto;
 line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{text-align:right}
.bubble{display:inline-block;padding:14px 18px;border-radius:15px;
 background:var(--panel);text-align:left;max-width:90%}
.user .bubble{background:var(--accent);color:white}
.composer-area{padding:15px 8% 22px}
.composer{max-width:850px;margin:auto;display:flex;gap:10px;
 background:var(--panel);border:1px solid var(--border);
 padding:10px;border-radius:16px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:150px;min-height:42px;
 background:transparent;border:0;outline:0;color:var(--text);
 padding:12px;font:15px Arial}
.action{border:0;background:var(--accent);color:white;
 width:43px;height:43px;border-radius:12px;cursor:pointer;font-size:18px}
.action.secondary{background:transparent;color:var(--muted)}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
@media(max-width:650px){
 .sidebar{width:65px;padding:12px 7px}
 .logo{font-size:17px;text-align:center}
 .logo span,.newchat .label,.history-title,.history,
 .sidebar-bottom button span{display:none}
 .newchat{font-size:20px;padding:12px 5px}
 .sidebar-bottom{flex-direction:column}
 .messages{padding:20px 12px}
 .composer-area{padding:12px}
 .welcome h1{font-size:29px}
 .topbar{padding:0 14px}
}
</style>
</head>

<body>
<div class="app">

 <aside class="sidebar">
  <div class="logo">✦ <span>Nova AI</span></div>
  <button class="newchat" onclick="newChat()">＋ <span class="label">New Chat</span></button>
  <div class="history-title">RECENT CHATS</div>
  <div class="history" id="history"></div>
  <div class="sidebar-bottom">
   <button onclick="toggleTheme()">◐ <span>Theme</span></button>
   <button onclick="clearHistory()">⌫ <span>Clear</span></button>
  </div>
 </aside>

 <main class="main">
  <header class="topbar">
   <h2>✦ Nova AI</h2>
   <div class="status">● Ready</div>
  </header>

  <section class="messages" id="messages">
   <div class="welcome" id="welcome">
    <h1>Hello, I'm <span>Nova.</span></h1>
    <p>Your intelligent AI assistant. Ask me anything, explore ideas,
    learn something new or get help with your work.</p>
   </div>
  </section>

  <div class="composer-area">
   <div class="composer">
    <textarea id="prompt" placeholder="Message Nova AI..."
     rows="1" onkeydown="handleKey(event)"></textarea>
    <button class="action secondary" onclick="voiceInput()" title="Voice input">🎙</button>
    <button class="action" onclick="sendMessage()" title="Send">➤</button>
   </div>
   <div class="hint">Nova AI can make mistakes. Check important information.</div>
  </div>
 </main>
</div>

<script>
let chats=JSON.parse(localStorage.getItem("nova_chats")||"[]");
let currentChat=null;
let busy=false;

function save(){
 localStorage.setItem("nova_chats",JSON.stringify(chats));
 renderHistory();
}
function newChat(){
 currentChat=null;
 document.getElementById("messages").innerHTML=
 '<div class="welcome" id="welcome"><h1>Hello, I\'m <span>Nova.</span></h1><p>Your intelligent AI assistant. What would you like to explore today?</p></div>';
}
function renderHistory(){
 const box=document.getElementById("history");
 box.innerHTML="";
 chats.forEach(chat=>{
  const item=document.createElement("div");
  item.className="history-item";
  item.textContent=chat.title;
  item.onclick=()=>openChat(chat.id);
  box.appendChild(item);
 });
}
function openChat(id){
 currentChat=chats.find(c=>c.id===id);
 const box=document.getElementById("messages");
 box.innerHTML="";
 currentChat.messages.forEach(m=>addBubble(m.text,m.role));
}
function addBubble(text,role){
 const box=document.getElementById("messages");
 const welcome=document.getElementById("welcome");
 if(welcome)welcome.remove();
 const row=document.createElement("div");
 row.className="message "+role;
 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;
 row.appendChild(bubble);
 box.appendChild(row);
 box.scrollTop=box.scrollHeight;
 return row;
}
function handleKey(e){
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();sendMessage();
 }
}
async function sendMessage(){
 const input=document.getElementById("prompt");
 const message=input.value.trim();
 if(!message||busy)return;
 input.value="";
 busy=true;
 addBubble(message,"user");

 if(!currentChat){
  currentChat={id:Date.now(),title:message.slice(0,35),messages:[]};
  chats.unshift(currentChat);
 }
 currentChat.messages.push({role:"user",text:message});
 save();

 const loading=addBubble("Nova is thinking...","assistant");
 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"AI request failed");
  loading.querySelector(".bubble").textContent=data.reply;
  currentChat.messages.push({role:"assistant",text:data.reply});
  save();
 }catch(error){
  loading.querySelector(".bubble").textContent=
   "Connection error: "+error.message+
   "\n\nPlease check your AI connection and try again.";
 }
 busy=false;
}
function toggleTheme(){
 document.body.classList.toggle("light");
 localStorage.setItem("nova_theme",
  document.body.classList.contains("light")?"light":"dark");
}
function clearHistory(){
 if(confirm("Delete all saved chats?")){
  chats=[];currentChat=null;save();newChat();
 }
}
function voiceInput(){
 const SpeechRecognition=window.SpeechRecognition||
  window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  alert("Voice input is not supported in this browser.");
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang="en-US";
 recognition.onresult=e=>{
  document.getElementById("prompt").value=
   e.results[0][0].transcript;
 };
 recognition.start();
}
if(localStorage.getItem("nova_theme")==="light")
 document.body.classList.add("light");
renderHistory();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10111a">
<meta name="description" content="QuBix AI — Your intelligent AI assistant">
<title>QuBix AI</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
:root{
  --bg:#10111a;--panel:#171923;--panel2:#202331;--text:#f4f5fa;
  --muted:#9ba0b2;--line:#2b2e3d;--accent:#8b7cff;--accent2:#6e5df5;
  --danger:#ef6262;--shadow:0 15px 45px #0005;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;height:100vh;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex}
.sidebar{width:270px;background:#141620;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:17px;flex-shrink:0;transition:.25s}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin:4px 0 24px}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#a28cff,#5c50e8);display:grid;place-items:center;font-weight:800;color:white}
.new-chat{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);text-align:left}
.new-chat:hover,.side-btn:hover{background:#292d3d}
.side-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:24px 0 9px}
.search-box{width:100%;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);outline:none}
.chat-list{overflow:auto;flex:1;margin-top:9px}
.chat-item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:9px;color:var(--muted);cursor:pointer;font-size:13px}
.chat-item:hover,.chat-item.active{background:var(--panel2);color:var(--text)}
.chat-item .chat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chat-item .pin{color:#f5c76a}
.side-bottom{border-top:1px solid var(--line);padding-top:12px}
.side-btn{width:100%;background:none;border:0;color:var(--muted);padding:10px;text-align:left;border-radius:9px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}
.top-left,.top-right{display:flex;align-items:center;gap:10px}
.icon-btn{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:9px;padding:8px 10px}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
select,.select{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:8px}
.user-dot{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700}
.content{flex:1;overflow-y:auto;padding:25px 20px 150px}
.welcome{max-width:760px;margin:10vh auto 0;text-align:center}
.welcome h1{font-size:clamp(28px,5vw,43px);margin:0 0 12px}
.gradient{background:linear-gradient(90deg,#a58cff,#62c6ff);background-clip:text;color:transparent}
.welcome p{color:var(--muted);line-height:1.7}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:32px;text-align:left}
.suggestion{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;cursor:pointer;color:var(--text)}
.suggestion:hover{border-color:var(--accent)}
.suggestion small{display:block;color:var(--muted);margin-top:6px}
.messages{max-width:850px;margin:0 auto}
.message{display:flex;gap:12px;margin:24px 0;align-items:flex-start}
.avatar{width:31px;height:31px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex-shrink:0;font-size:13px}
.message.user .avatar{background:var(--accent)}
.message-body{min-width:0;flex:1;line-height:1.7;overflow-wrap:anywhere}
.message-role{font-size:12px;color:var(--muted);margin-bottom:5px}
.message-content{font-size:14px}
.message-content p{margin:7px 0 13px}
.message-content pre{background:#0b0c12;padding:14px;border-radius:10px;overflow:auto;border:1px solid var(--line)}
.message-content code{font-family:Consolas,monospace;font-size:13px}
.message-content :not(pre)>code{background:var(--panel2);padding:2px 5px;border-radius:5px}
.message-content img{max-width:100%;border-radius:12px}
.message-content a{color:#a99cff}
.message-content blockquote{border-left:3px solid var(--accent);padding-left:13px;color:var(--muted)}
.message-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.message-actions button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 8px;font-size:11px}
.message-actions button:hover{color:var(--text);background:var(--panel2)}
.generated-image{max-width:100%;border-radius:12px;margin-top:10px;display:block}
.composer-wrap{position:fixed;bottom:0;left:270px;right:0;padding:15px 20px 18px;background:linear-gradient(transparent,var(--bg) 18%)}
.composer{max-width:850px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:11px 13px;box-shadow:var(--shadow)}
#messageInput{width:100%;resize:none;min-height:48px;max-height:180px;background:transparent;border:0;outline:0;color:var(--text);padding:8px;font-size:14px}
.composer-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tool-btn{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:8px;font-size:12px}
.tool-btn:hover{background:var(--panel2);color:var(--text)}
.tool-btn.active{color:#b3a7ff}
.send-btn{margin-left:auto;background:var(--accent2);color:white;border:0;border-radius:10px;padding:9px 15px;font-weight:600}
.send-btn:disabled{opacity:.45;cursor:not-allowed}
.disclaimer{text-align:center;color:var(--muted);font-size:10px;margin-top:8px}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.toggle input{accent-color:var(--accent)}
.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#292d3d;border:1px solid var(--line);padding:11px 16px;border-radius:10px;z-index:1000;display:none;font-size:13px;box-shadow:var(--shadow)}
.modal-backdrop{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:100; padding:15px}
.modal{width:min(520px,100%);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:var(--shadow)}
.modal h2{margin-top:0}
.modal input,.modal textarea,.modal select{width:100%;padding:11px;margin:7px 0 14px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px}
.modal textarea{min-height:90px;resize:vertical}
.primary{background:var(--accent2);color:white;border:0;padding:10px 15px;border-radius:9px}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:10px 15px;border-radius:9px}
.danger{color:var(--danger)}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.auth-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:none;align-items:center;justify-content:center;padding:18px}
.auth-card{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px}
.auth-card input{width:100%;padding:12px;margin:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text)}
.auth-card button{width:100%;margin-top:9px}
.file-chip{font-size:11px;color:#b9adff;padding:5px 8px}
.typing{color:var(--muted);font-size:13px}
body.light{--bg:#f5f6fb;--panel:#fff;--panel2:#eceef6;--text:#202234;--muted:#73798c;--line:#dfe2ec;--shadow:0 15px 45px #18204415}
body.light .sidebar{background:#fff}
body.light .composer-wrap{background:linear-gradient(transparent,var(--bg) 18%)}
body.light .message-content pre{background:#f0f1f6;color:#202234}
@media(max-width:760px){
 .sidebar{position:fixed;z-index:50;top:0;bottom:0;left:-280px;box-shadow:var(--shadow)}
 .sidebar.open{left:0}
 .composer-wrap{left:0;padding:10px}
 .topbar{padding:0 12px}
 .content{padding:18px 12px 150px}
 .suggestions{grid-template-columns:1fr}
 .welcome{margin-top:7vh}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">Q</div>QuBix AI</div>
    <button class="new-chat" id="newChatBtn">＋ &nbsp; New chat</button>
    <div class="side-label">Your conversations</div>
    <input class="search-box" id="chatSearch" placeholder="Search chats...">
    <div class="chat-list" id="chatList"></div>
    <div class="side-bottom">
      <button class="side-btn" id="memoryBtn">✦ &nbsp; Memories</button>
      <button class="side-btn" id="settingsBtn">⚙ &nbsp; Settings</button>
      <button class="side-btn" id="accountBtn">◉ &nbsp; Account / Sign in</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" id="menuBtn">☰</button>
        <strong id="topTitle">New chat</strong>
      </div>
      <div class="top-right">
        <select id="modeSelect" aria-label="Assistant mode">
          <option value="normal">✨ Normal</option>
          <option value="study">📚 Study</option>
          <option value="coding">💻 Coding</option>
          <option value="creative">🎨 Creative</option>
          <option value="research">🔎 Research</option>
        </select>
        <button class="icon-btn" id="shareBtn" title="Share chat">↗</button>
        <div class="user-dot" id="userAvatar">Q</div>
      </div>
    </header>

    <section class="content" id="content">
      <div class="welcome" id="welcome">
        <h1>Meet <span class="gradient">QuBix AI</span></h1>
        <p>Your intelligent assistant for ideas, learning, coding, research and creativity.</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Give me five useful ideas for a new website.">💡 Explore ideas<small>Discover something interesting</small></button>
          <button class="suggestion" data-prompt="Teach me an interesting topic step by step.">📚 Learn something<small>Understand a new topic</small></button>
          <button class="suggestion" data-prompt="Help me write a JavaScript function.">💻 Write code<small>Build and solve problems</small></button>
          <button class="suggestion" data-prompt="Give me a creative story idea.">🎨 Get creative<small>Turn imagination into something</small></button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <div id="fileChip" class="file-chip" hidden></div>
        <textarea id="messageInput" rows="1" placeholder="Message QuBix AI..."></textarea>
        <div class="composer-tools">
          <button class="tool-btn" id="attachBtn" title="Attach a text file">＋ Attach</button>
          <input id="fileInput" type="file" hidden accept=".txt,.md,.csv,.json">
          <button class="tool-btn" id="imageBtn" title="Generate an image">▧ Image</button>
          <button class="tool-btn" id="voiceBtn" title="Voice input">🎙 Voice</button>
          <label class="toggle"><input type="checkbox" id="webToggle"> Web search</label>
          <button class="send-btn" id="sendBtn">Send ↑</button>
        </div>
      </div>
      <div class="disclaimer">QuBix AI can make mistakes. Check important information.</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="brand"><div class="logo">Q</div>QuBix AI</div>
    <h2 id="authTitle">Welcome back</h2>
    <p style="color:var(--muted);font-size:13px">Sign in to save your chats and memories.</p>
    <input id="authEmail" type="email" placeholder="Email address" autocomplete="email">
    <input id="authPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="authSubmit">Sign in</button>
    <button class="secondary" id="authSwitch">Create an account</button>
    <button class="side-btn" id="forgotBtn">Forgot password?</button>
    <button class="side-btn" id="guestBtn">Continue browsing</button>
  </div>
</div>

<script>
"use strict";

/* QuBix configuration */
const SUPABASE_URL = "https://tehtdnaziyjwuacfxzsk.supabase.co";
const SUPABASE_KEY = "sb_publishable_k50vs5oP1POySSKevkaSYw_fgPn7O_T";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const API_URL = "/api/chat";
const $ = id => document.getElementById(id);

let currentUser = null;
let currentSession = null;
let currentChatId = null;
let chats = [];
let currentMessages = [];
let attachedFile = null;
let attachedText = "";
let isSending = false;
let authMode = "signin";
let memories = [];
let profile = {
  preferred_language: "auto",
  response_style: "balanced",
  custom_instructions: ""
};

marked.setOptions({
  breaks: true,
  gfm: true
});

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.style.display = "none", 3000);
}

function safeMarkdown(text) {
  const html = marked.parse(String(text || ""));
  return DOMPurify.sanitize(html, {
    USE_PROFILES: { html: true },
    ADD_ATTR: ["target", "rel"]
  });
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function showModal(html) {
  $("modal").innerHTML = html;
  $("modalBackdrop").style.display = "flex";
}

function closeModal() {
  $("modalBackdrop").style.display = "none";
  $("modal").innerHTML = "";
}

$("modalBackdrop").addEventListener("click", e => {
  if (e.target === $("modalBackdrop")) closeModal();
});

function setAuthScreen(show) {
  $("authScreen").style.display = show ? "flex" : "none";
}

async function getToken() {
  if (!currentSession) return null;
  return currentSession.access_token;
}

async function apiRequest(payload) {
  const token = await getToken();
  if (!token) throw new Error("Please sign in first.");

  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify(payload)
  });

  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Request failed.");
  return data;
}

function setLoading(value) {
  isSending = value;
  $("sendBtn").disabled = value;
  $("sendBtn").textContent = value ? "Working..." : "Send ↑";
}

function showWelcome(show) {
  $("welcome").style.display = show ? "block" : "none";
}

function renderMessage(message, index) {
  const isUser = message.role === "user";
  const content = safeMarkdown(message.content || "");
  const wrapper = document.createElement("article");
  wrapper.className = "message " + (isUser ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = isUser ? "U" : "Q";

  const body = document.createElement("div");
  body.className = "message-body";
  const role = document.createElement("div");
  role.className = "message-role";
  role.textContent = isUser ? "You" : "QuBix AI";

  const text = document.createElement("div");
  text.className = "message-content";
  text.innerHTML = content;

  const actions = document.createElement("div");
  actions.className = "message-actions";

  const copy = document.createElement("button");
  copy.textContent = "Copy";
  copy.onclick = () => copyText(message.content || "");
  actions.appendChild(copy);

  if (!isUser) {
    const regenerate = document.createElement("button");
    regenerate.textContent = "Regenerate";
    regenerate.onclick = () => regenerateAnswer(index);
    actions.appendChild(regenerate);

    const good = document.createElement("button");
    good.textContent = "👍";
    good.onclick = () => toast("Thanks for your feedback!");
    actions.appendChild(good);

    const bad = document.createElement("button");
    bad.textContent = "👎";
    bad.onclick = () => toast("Feedback noted.");
    actions.appendChild(bad);
  }

  body.append(role, text, actions);
  wrapper.append(avatar, body);
  $("messages").appendChild(wrapper);
}

function renderMessages() {
  $("messages").innerHTML = "";
  showWelcome(currentMessages.length === 0);
  currentMessages.forEach((m, i) => renderMessage(m, i));
  $("content").scrollTop = $("content").scrollHeight;
}

function renderChats() {
  const query = $("chatSearch").value.toLowerCase().trim();
  $("chatList").innerHTML = "";

  const filtered = chats.filter(c =>
    String(c.title || "New chat").toLowerCase().includes(query)
  );

  filtered.forEach(chat => {
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === currentChatId ? " active" : "");

    const pin = document.createElement("span");
    pin.className = "pin";
    pin.textContent = chat.pinned ? "★" : "▤";

    const name = document.createElement("span");
    name.className = "chat-name";
    name.textContent = chat.title || "New chat";

    const menu = document.createElement("button");
    menu.className = "icon-btn";
    menu.textContent = "⋯";
    menu.title = "Chat options";
    menu.onclick = e => {
      e.stopPropagation();
      chatOptions(chat);
    };

    item.append(pin, name, menu);
    item.onclick = () => openChat(chat.id);
    $("chatList").appendChild(item);
  });
}

async function loadChats() {
  if (!currentUser) {
    chats = [];
    renderChats();
    return;
  }

  const { data, error } = await db
    .from("chats")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("updated_at", { ascending: false });

  if (error) {
    console.error(error);
    toast("Could not load chat history.");
    return;
  }

  chats = (data || []).map(c => ({
    ...c,
    pinned: Boolean(c.pinned)
  }));
  renderChats();
}

async function createChat() {
  if (!currentUser) {
    toast("Sign in to save conversations.");
    setAuthScreen(true);
    return;
  }

  const { data, error } = await db
    .from("chats")
    .insert({
      user_id: currentUser.id,
      title: "New chat"
    })
    .select()
    .single();

  if (error) {
    toast(error.message);
    return;
  }

  currentChatId = data.id;
  currentMessages = [];
  $("topTitle").textContent = data.title;
  renderMessages();
  await loadChats();
  $("messageInput").focus();
}

async function openChat(id) {
  if (!currentUser) return;

  const { data: chat, error: chatError } = await db
    .from("chats")
    .select("*")
    .eq("id", id)
    .eq("user_id", currentUser.id)
    .single();

  if (chatError) {
    toast("Could not open chat.");
    return;
  }

  const { data: messages, error } = await db
    .from("messages")
    .select("*")
    .eq("chat_id", id)
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: true });

  if (error) {
    toast("Could not load messages.");
    return;
  }

  currentChatId = id;
  currentMessages = messages || [];
  $("topTitle").textContent = chat.title || "Chat";
  renderChats();
  renderMessages();
  $("sidebar").classList.remove("open");
}

async function saveMessage(role, content) {
  if (!currentUser || !currentChatId) return;

  const { error } = await db.from("messages").insert({
    chat_id: currentChatId,
    user_id: currentUser.id,
    role,
    content
  });

  if (error) throw error;

  await db.from("chats")
    .update({ updated_at: new Date().toISOString() })
    .eq("id", currentChatId)
    .eq("user_id", currentUser.id);
}

async function updateChatTitleFromMessage(message) {
  if (!currentChatId) return;
  const chat = chats.find(c => c.id === currentChatId);
  if (!chat || chat.title !== "New chat") return;

  const title = message.trim().replace(/\s+/g, " ").slice(0, 45) || "New chat";
  await db.from("chats")
    .update({ title })
    .eq("id", currentChatId)
    .eq("user_id", currentUser.id);

  $("topTitle").textContent = title;
  await loadChats();
}

async function sendMessage(forcedMessage = null) {
  if (isSending) return;

  const input = $("messageInput");
  const message = String(forcedMessage ?? input.value).trim();
  if (!message && !attachedText) return;

  if (!currentUser) {
    toast("Sign in to use QuBix AI.");
    setAuthScreen(true);
    return;
  }

  if (!currentChatId) await createChat();
  if (!currentChatId) return;

  const actualMessage = attachedText
    ? message + "\n\nAttached file (" + (attachedFile?.name || "file") + "):\n" + attachedText
    : message;

  input.value = "";
  input.style.height = "auto";
  clearAttachment();

  const userMessage = { role: "user", content: actualMessage };
  currentMessages.push(userMessage);
  renderMessages();

  setLoading(true);
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "QuBix AI is thinking...";
  $("messages").appendChild(typing);

  try {
    await saveMessage("user", actualMessage);
    await updateChatTitleFromMessage(message || "Attached file");

    const history = currentMessages.slice(0, -1).slice(-20);
    const data = await apiRequest({
      message: actualMessage,
      messages: history,
      action: "chat",
      mode: $("modeSelect").value,
      webSearchEnabled: $("webToggle").checked
    });

    const answer = data.answer || "I couldn't generate an answer.";
    currentMessages.push({ role: "assistant", content: answer });
    await saveMessage("assistant", answer);

    typing.remove();
    renderMessages();
    await loadChats();
  } catch (error) {
    typing.remove();
    currentMessages.pop();
    renderMessages();
    toast(error.message || "Something went wrong.");
  } finally {
    setLoading(false);
    input.focus();
  }
}

async function regenerateAnswer(index) {
  if (isSending || !currentUser || !currentChatId) return;

  const target = currentMessages[index];
  if (!target || target.role !== "assistant") return;

  let userIndex = index - 1;
  while (userIndex >= 0 && currentMessages[userIndex].role !== "user") userIndex--;
  if (userIndex < 0) return;

  const chatId = currentChatId;
  const userMessage = currentMessages[userIndex].content;
  const oldVisibleMessages = currentMessages.slice(0, index);

  setLoading(true);
  currentMessages = oldVisibleMessages;
  renderMessages();

  try {
    // Remove the previous answer from the database before generating a replacement.
    const { data: oldRows, error: findError } = await db
      .from("messages")
      .select("id")
      .eq("chat_id", chatId)
      .eq("user_id", currentUser.id)
      .eq("role", "assistant")
      .eq("content", target.content)
      .order("created_at", { ascending: false })
      .limit(1);

    if (findError) throw findError;

    if (oldRows && oldRows.length) {
      const { error: deleteError } = await db
        .from("messages")
        .delete()
        .eq("id", oldRows[0].id)
        .eq("chat_id", chatId)
        .eq("user_id", currentUser.id);
      if (deleteError) throw deleteError;
    }

    const data = await apiRequest({
      message: userMessage,
      messages: currentMessages.slice(0, -1).slice(-20),
      action: "chat",
      mode: $("modeSelect").value,
      webSearchEnabled: $("webToggle").checked
    });

    const answer = data.answer || "No answer returned.";
    currentMessages.push({ role: "assistant", content: answer });
    await saveMessage("assistant", answer);
    renderMessages();
    await loadChats();
  } catch (error) {
    toast(error.message || "Could not regenerate answer.");
    await openChat(chatId);
  } finally {
    setLoading(false);
  }
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(String(text || ""));
    toast("Copied!");
  } catch {
    toast("Copy failed. Please select the text manually.");
  }
}

function chatOptions(chat) {
  showModal(`
    <h2>Chat options</h2>
    <p style="color:var(--muted)">${escapeHTML(chat.title || "Chat")}</p>
    <button class="secondary" style="width:100%;margin:5px 0" id="renameChat">✎ Rename chat</button>
    <button class="secondary" style="width:100%;margin:5px 0" id="pinChat">${chat.pinned ? "☆ Unpin chat" : "★ Pin chat"}</button>
    <button class="secondary" style="width:100%;margin:5px 0" id="exportChat">⇩ Export Markdown</button>
    <button class="secondary" style="width:100%;margin:5px 0" id="shareThisChat">↗ Share chat</button>
    <button class="secondary danger" style="width:100%;margin:5px 0" id="deleteChat">⌫ Delete chat</button>
    <div class="modal-actions" style="margin-top:14px"><button class="secondary" id="closeChatOptions">Close</button></div>
  `);

  $("closeChatOptions").onclick = closeModal;

  $("renameChat").onclick = async () => {
    const title = prompt("Enter a new chat name:", chat.title || "");
    if (!title?.trim()) return;
    const { error } = await db.from("chats")
      .update({ title: title.trim().slice(0, 100) })
      .eq("id", chat.id)
      .eq("user_id", currentUser.id);
    if (error) return toast(error.message);
    if (currentChatId === chat.id) $("topTitle").textContent = title.trim();
    closeModal();
    await loadChats();
  };

  $("pinChat").onclick = async () => {
    const { error } = await db.from("chats")
      .update({ pinned: !chat.pinned })
      .eq("id", chat.id)
      .eq("user_id", currentUser.id);
    closeModal();
    if (error) toast("Pinning needs the pinned column in chats table.");
    else {
      toast(chat.pinned ? "Chat unpinned." : "Chat pinned.");
      await loadChats();
    }
  };

  $("exportChat").onclick = () => exportChat(chat.id);
  $("shareThisChat").onclick = () => shareChat(chat.id);

  $("deleteChat").onclick = async () => {
    if (!confirm("Delete this chat and its messages? This cannot be undone.")) return;
    const { error } = await db.from("messages")
      .delete()
      .eq("chat_id", chat.id)
      .eq("user_id", currentUser.id);
    if (error) return toast(error.message);

    const result = await db.from("chats")
      .delete()
      .eq("id", chat.id)
      .eq("user_id", currentUser.id);

    if (result.error) return toast(result.error.message);
    if (currentChatId === chat.id) {
      currentChatId = null;
      currentMessages = [];
      $("topTitle").textContent = "New chat";
      renderMessages();
    }
    closeModal();
    await loadChats();
    toast("Chat deleted.");
  };
}

async function exportChat(id) {
  if (!currentUser) return;
  const { data: chat } = await db.from("chats")
    .select("*").eq("id", id).eq("user_id", currentUser.id).single();
  const { data: messages, error } = await db.from("messages")
    .select("role,content,created_at")
    .eq("chat_id", id)
    .eq("user_id", currentUser.id)
    .order("created_at");

  if (error) return toast(error.message);

  const text = "# " + (chat?.title || "QuBix chat") + "\n\n" +
    (messages || []).map(m =>
      "## " + (m.role === "user" ? "You" : "QuBix AI") + "\n\n" + m.content
    ).join("\n\n---\n\n");

  downloadFile(text, (chat?.title || "qubix-chat") + ".md", "text/markdown");
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function shareChat(id) {
  if (!currentUser) return toast("Please sign in first.");

  showModal(`
    <h2>Share conversation</h2>
    <p style="color:var(--muted)">Create a read-only public link or manage existing links.</p>
    <button class="primary" id="createShareLink" style="width:100%">＋ Create new share link</button>
    <div id="shareStatus" style="margin-top:18px">Loading links...</div>
    <div class="modal-actions" style="margin-top:15px"><button class="secondary" id="closeShare">Close</button></div>
  `);

  $("closeShare").onclick = closeModal;

  async function refreshLinks() {
    const status = $("shareStatus");
    if (!status) return;
    status.textContent = "Loading links...";

    const { data, error } = await db
      .from("qubix_shares")
      .select("id,share_token,created_at")
      .eq("chat_id", id)
      .eq("user_id", currentUser.id)
      .order("created_at", { ascending: false });

    if (error) {
      status.textContent = "Could not load links: " + error.message;
      return;
    }

    status.innerHTML = "";
    if (!data || !data.length) {
      status.textContent = "No share links created yet.";
      return;
    }

    data.forEach(share => {
      const row = document.createElement("div");
      row.style.cssText = "padding:12px 0;border-bottom:1px solid var(--line)";

      const link = location.origin + "/share.html?token=" + encodeURIComponent(share.share_token);
      const input = document.createElement("input");
      input.value = link;
      input.readOnly = true;
      input.style.width = "100%";

      const copy = document.createElement("button");
      copy.className = "secondary";
      copy.textContent = "Copy link";
      copy.onclick = () => copyText(link);

      const revoke = document.createElement("button");
      revoke.className = "secondary danger";
      revoke.textContent = "Revoke link";
      revoke.onclick = async () => {
        if (!confirm("Revoke this public link?")) return;
        const { error: deleteError } = await db
          .from("qubix_shares")
          .delete()
          .eq("id", share.id)
          .eq("user_id", currentUser.id);
        if (deleteError) return toast(deleteError.message);
        toast("Share link revoked.");
        await refreshLinks();
      };

      row.append(input, copy, revoke);
      status.appendChild(row);
    });
  }

  $("createShareLink").onclick = async () => {
    const button = $("createShareLink");
    button.disabled = true;
    button.textContent = "Creating...";
    try {
      const { error } = await db.from("qubix_shares").insert({
        chat_id: id,
        user_id: currentUser.id
      });
      if (error) throw error;
      toast("Share link created.");
      await refreshLinks();
    } catch (error) {
      toast("Could not create link: " + error.message);
    } finally {
      button.disabled = false;
      button.textContent = "＋ Create new share link";
    }
  };

  await refreshLinks();
}

async function loadProfile() {
  if (!currentUser) return;
  const { data, error } = await db.from("qubix_profiles")
    .select("*")
    .eq("user_id", currentUser.id)
    .maybeSingle();

  if (!error && data) profile = { ...profile, ...data };
}

async function saveProfile() {
  if (!currentUser) return toast("Sign in to save settings.");

  const values = {
    user_id: currentUser.id,
    preferred_language: $("languageSelect").value,
    response_style: $("styleSelect").value,
    custom_instructions: $("customInstructions").value,
    updated_at: new Date().toISOString()
  };

  const { error } = await db.from("qubix_profiles")
    .upsert(values, { onConflict: "user_id" });

  if (error) return toast(error.message);
  profile = { ...profile, ...values };
  closeModal();
  toast("Settings saved.");
}

function openSettings() {
  showModal(`
    <h2>QuBix settings</h2>
    <label>Preferred language</label>
    <select id="languageSelect">
      <option value="auto">Automatic</option>
      <option value="English">English</option>
      <option value="Urdu">Urdu</option>
      <option value="Roman Urdu">Roman Urdu</option>
      <option value="Punjabi">Punjabi</option>
      <option value="Hindi">Hindi</option>
      <option value="Arabic">Arabic</option>
    </select>
    <label>Voice input language</label>
    <select id="voiceLanguageSelect">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="ur-PK">Urdu</option>
      <option value="hi-IN">Hindi</option>
      <option value="pa-IN">Punjabi (India)</option>
      <option value="ar-SA">Arabic</option>
    </select>
    <label>Response style</label>
    <select id="styleSelect">
      <option value="balanced">Balanced</option>
      <option value="concise">Short and concise</option>
      <option value="detailed">Detailed</option>
      <option value="friendly">Friendly</option>
      <option value="professional">Professional</option>
    </select>
    <label>Custom instructions</label>
    <textarea id="customInstructions" placeholder="Tell QuBix how you want it to respond..."></textarea>
    <label>Appearance</label>
    <select id="themeSelect">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
    <div class="modal-actions">
      <button class="secondary" id="closeSettings">Cancel</button>
      <button class="primary" id="saveSettings">Save settings</button>
    </div>
  `);

  $("languageSelect").value = profile.preferred_language || "auto";
  $("voiceLanguageSelect").value = localStorage.getItem("qubix_voice_language") || "en-US";
  $("voiceLanguageSelect").onchange = e => {
    localStorage.setItem("qubix_voice_language", e.target.value);
  };
  $("styleSelect").value = profile.response_style || "balanced";
  $("customInstructions").value = profile.custom_instructions || "";
  $("themeSelect").value = localStorage.getItem("qubix_theme") || "dark";

  $("closeSettings").onclick = closeModal;
  $("saveSettings").onclick = saveProfile;
  $("themeSelect").onchange = e => setTheme(e.target.value);
}

function setTheme(theme) {
  document.body.classList.toggle("light", theme === "light");
  localStorage.setItem("qubix_theme", theme);
}

async function loadMemories() {
  const data = await apiRequest({ action: "memory_list" });
  memories = data.memories || [];
  return memories;
}

async function openMemories() {
  if (!currentUser) {
    toast("Sign in to manage memories.");
    setAuthScreen(true);
    return;
  }

  showModal(`
    <h2>QuBix memories</h2>
    <p style="font-size:12px;color:var(--muted)">Saved information that may help personalize future answers.</p>
    <div id="memoryList">Loading...</div>
    <div class="modal-actions" style="margin-top:15px">
      <button class="secondary" id="addMemory">＋ Add memory</button>
      <button class="secondary" id="closeMemories">Close</button>
    </div>
  `);

  $("closeMemories").onclick = closeModal;
  $("addMemory").onclick = addMemoryPrompt;

  try {
    await refreshMemoryList();
  } catch (error) {
    $("memoryList").textContent = error.message;
  }
}

async function refreshMemoryList() {
  await loadMemories();
  const list = $("memoryList");
  if (!list) return;

  if (!memories.length) {
    list.textContent = "No saved memories yet.";
    return;
  }

  list.innerHTML = "";
  memories.forEach(memory => {
    const row = document.createElement("div");
    row.style.cssText = "padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center";
    const text = document.createElement("div");
    text.style.cssText = "flex:1;font-size:13px";
    text.textContent = memory.memory;

    const del = document.createElement("button");
    del.className = "secondary danger";
    del.textContent = "Delete";
    del.onclick = async () => {
      if (!confirm("Delete this memory?")) return;
      try {
        await apiRequest({ action: "memory_delete", id: memory.id });
        await refreshMemoryList();
      } catch (e) { toast(e.message); }
    };
    row.append(text, del);
    list.appendChild(row);
  });
}

async function addMemoryPrompt() {
  const memory = prompt("What should QuBix remember?");
  if (!memory?.trim()) return;

  try {
    await apiRequest({
      action: "memory_save",
      memory: memory.trim(),
      category: "general"
    });
    await refreshMemoryList();
    toast("Memory saved.");
  } catch (error) {
    toast(error.message);
  }
}

function clearAttachment() {
  attachedFile = null;
  attachedText = "";
  $("fileChip").hidden = true;
  $("fileChip").textContent = "";
  $("fileInput").value = "";
}

async function handleFile(file) {
  if (!file) return;
  const maxSize = 5 * 1024 * 1024;
  if (file.size > maxSize) {
    toast("File is too large. Maximum size is 5 MB.");
    return;
  }

  const ext = file.name.split(".").pop().toLowerCase();
  if (!["txt", "md", "csv", "json"].includes(ext)) {
    toast("This file type is not yet supported for text extraction. Use TXT, MD, CSV or JSON.");
    return;
  }

  try {
    attachedText = await file.text();
    attachedFile = file;
    $("fileChip").hidden = false;
    $("fileChip").textContent = "Attached: " + file.name + " · " + Math.round(file.size / 1024) + " KB";
    toast("File attached.");
  } catch {
    toast("Could not read this file.");
  }
}

async function generateImageFromPrompt(promptText) {
  if (!currentUser) {
    toast("Sign in to generate images.");
    setAuthScreen(true);
    return;
  }
  if (!promptText.trim()) return;

  setLoading(true);
  const userMessage = { role: "user", content: "Generate an image: " + promptText };
  currentMessages.push(userMessage);
  renderMessages();

  try {
    await saveMessage("user", userMessage.content);
    const data = await apiRequest({
      action: "generate_image",
      prompt: promptText
    });

    if (!data.image?.data) throw new Error("No image returned.");

    const mime = data.image.mimeType || "image/png";
    const imageUrl = "data:" + mime + ";base64," + data.image.data;

    const message = {
      role: "assistant",
      content: "Your image has been generated."
    };
    currentMessages.push(message);
    await saveMessage("assistant", message.content);
    renderMessages();

    const last = $("messages").lastElementChild;
    const image = document.createElement("img");
    image.className = "generated-image";
    image.src = imageUrl;
    image.alt = "Generated image";

    const download = document.createElement("a");
    download.href = imageUrl;
    download.download = "qubix-generated-image.png";
    download.textContent = "Download image";
    download.style.cssText = "display:inline-block;margin-top:8px;color:#a99cff;font-size:13px";

    last.querySelector(".message-content").append(image, download);
    $("content").scrollTop = $("content").scrollHeight;
  } catch (error) {
    currentMessages.pop();
    renderMessages();
    toast(error.message);
  } finally {
    setLoading(false);
  }
}

function startVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    toast("Voice input is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = localStorage.getItem("qubix_voice_language") || "en-US";
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  const button = $("voiceBtn");
  const originalText = button.textContent;
  button.textContent = "Listening...";
  button.disabled = true;

  recognition.onresult = event => {
    let transcript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    if (transcript) {
      $("messageInput").value = transcript;
      $("messageInput").dispatchEvent(new Event("input"));
    }
  };

  recognition.onerror = event => toast("Voice input error: " + event.error);
  recognition.onend = () => {
    button.textContent = originalText;
    button.disabled = false;
  };

  try {
    recognition.start();
  } catch (error) {
    button.textContent = originalText;
    button.disabled = false;
    toast("Could not start voice input.");
  }
}

async function authSubmit() {
  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;

  if (!email || !password) return toast("Enter email and password.");

  $("authSubmit").disabled = true;
  try {
    if (authMode === "signup") {
      const { data, error } = await db.auth.signUp({ email, password });
      if (error) throw error;

      if (data.session) {
        currentSession = data.session;
        currentUser = data.user;
        setAuthScreen(false);
      } else {
        toast("Account created. Check your email to confirm, then sign in.");
      }
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      currentSession = data.session;
      currentUser = data.user;
      setAuthScreen(false);
    }
  } catch (error) {
    toast(error.message);
  } finally {
    $("authSubmit").disabled = false;
  }
}

async function afterLogin() {
  $("userAvatar").textContent = (currentUser.email || "Q").charAt(0).toUpperCase();
  await loadProfile();
  await loadChats();
  toast("Signed in successfully.");
}

async function signOut() {
  const { error } = await db.auth.signOut();
  if (error) return toast(error.message);

  currentUser = null;
  currentSession = null;
  currentChatId = null;
  currentMessages = [];
  chats = [];
  renderChats();
  renderMessages();
  $("topTitle").textContent = "New chat";
  closeModal();
  toast("Signed out.");
}

function openAccount() {
  if (!currentUser) {
    setAuthScreen(true);
    return;
  }

  showModal(`
    <h2>Your account</h2>
    <p style="color:var(--muted)">${escapeHTML(currentUser.email || "")}</p>
    <p style="font-size:12px;color:var(--muted)">Your chats and memories are associated with this account.</p>
    <div class="modal-actions">
      <button class="secondary" id="closeAccount">Close</button>
      <button class="primary" id="signOutBtn">Sign out</button>
    </div>
  `);
  $("closeAccount").onclick = closeModal;
  $("signOutBtn").onclick = signOut;
}

function forgotPassword() {
  const email = $("authEmail").value.trim();
  if (!email) return toast("Enter your email address first.");

  db.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin
  }).then(({ error }) => {
    if (error) toast(error.message);
    else toast("Password reset email sent.");
  });
}

/* UI events */
$("newChatBtn").onclick = createChat;
$("sendBtn").onclick = () => sendMessage();
$("messageInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
$("messageInput").addEventListener("input", () => {
  const el = $("messageInput");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 180) + "px";
});
$("chatSearch").oninput = renderChats;
$("settingsBtn").onclick = openSettings;
$("memoryBtn").onclick = openMemories;
$("accountBtn").onclick = openAccount;
$("menuBtn").onclick = () => $("sidebar").classList.toggle("open");
$("shareBtn").onclick = () => {
  if (currentChatId) shareChat(currentChatId);
  else toast("Start a conversation first.");
};
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => handleFile(e.target.files[0]);
$("voiceBtn").onclick = startVoiceInput;
$("imageBtn").onclick = () => {
  const promptText = prompt("Describe the image you want QuBix AI to generate:");
  if (promptText?.trim()) generateImageFromPrompt(promptText.trim());
};

$("authSubmit").onclick = authSubmit;
$("authSwitch").onclick = () => {
  authMode = authMode === "signin" ? "signup" : "signin";
  $("authTitle").textContent = authMode === "signup" ? "Create your account" : "Welcome back";
  $("authSubmit").textContent = authMode === "signup" ? "Create account" : "Sign in";
  $("authSwitch").textContent = authMode === "signup" ? "Back to sign in" : "Create an account";
};
$("forgotBtn").onclick = forgotPassword;
$("guestBtn").onclick = () => setAuthScreen(false);

document.querySelectorAll(".suggestion").forEach(button => {
  button.onclick = () => sendMessage(button.dataset.prompt);
});

async function init() {
  setTheme(localStorage.getItem("qubix_theme") || "dark");

  const { data } = await db.auth.getSession();
  currentSession = data.session;
  currentUser = data.session?.user || null;

  db.auth.onAuthStateChange((_event, session) => {
    currentSession = session;
    currentUser = session?.user || null;
    if (currentUser) {
      setAuthScreen(false);
      setTimeout(afterLogin, 0);
    } else {
      chats = [];
      currentChatId = null;
      currentMessages = [];
      renderChats();
      renderMessages();
    }
  });

  if (currentUser) {
    await afterLogin();
  } else {
    $("userAvatar").textContent = "Q";
    renderMessages();
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(err => {
      console.warn("Service worker registration failed:", err);
    });
  }
}

init();
</script>
